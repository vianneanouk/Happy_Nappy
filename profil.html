<!DOCTYPE html>
<html lang="en">
  <head>

    <!-- Diese Seite zeigt das Profil des/der Nutzer:in an, also die Informationen, die bei der Registrierung eingegeben wurden. Nutzer:innen haben die Möglichkeit ihren Vor- und Nachnamen dort einzugeben. 
     Es gibt  die Möglichkeit, neue Kinder hinzuzufügen. Danach werden die auf dieser Seite angezeigt. Wenn der/die Nutzer:in der Administrator der Familie ist, wird zusätzlich ein Einladungslink angezeigt, den er/sie an andere Personen senden kann, damit diese der Familie beitreten können.
     Die Logik wird über die JavaScript-Dateien umgesetzt, welche die Daten laden, aktualisieren und speichern. Das Layout und Design werden durch die CSS-Dateien style.css und profil.css gestaltet. 
     Die Tabelle über die Windelgrössen ist ein starres Element, welches als Orientierungshilfe für die Nutzer:innen dient. 
     Die Navigation am unteren Bildschirmrand ermöglicht den Zugriff auf andere Bereiche der App wie Home, Bestellung und Statistik. -->
     
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profil</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/profil.css" />
  </head>
  <body>

    <main class="profil-page">

      <section class="profil-header">
        <h1>Dein Profil</h1>
      </section>


    <form id="profilForm">
      <div>
        <label><h4>Vorname</h4></label>
        <input class="textfeld"type="text" id="vorname" required />
      </div>
      <div>
        <label><h4>Nachname</h4></label>
        <input class="textfeld" type="text" id="nachname" required />
      </div>

      <div>
        <label><h4>E-Mail</h4></label>
        <input class="textfeld" type="text" id="email" readonly />
      </div>
      

      <div>
        <label><h4>Beigetreten am</h4></label>
        <input class="textfeld" type="text" id="beitrittsdatum" readonly />
      </div>

          <div>
        <label><h4>Familie</h4></label>
        <input class="textfeld" type="text" id="familienname" readonly />
      </div>

      <div>
        <label><h4>Familien-ID</h4></label>
        <input class="textfeld" type="text" id="familien_id" readonly />
      </div>

      <div id="adminInviteSection" style="display: none;">

      <div>
        <label><h4>Einladungslink zum Versenden</h4></label>
        <input class="textfeld" type="text" id="inviteLink" readonly />
      </div>

      </div>

  <h2>Kinder</h2>

  <div id="kinderContainer"></div>

  <button type="button" id="addKindBtn">
    Kind hinzufügen
  </button>

  <br><br>

  <button type="submit">
    Speichern
  </button> 

  <p id="saveMessage"></p>

  <button type="button" id="logoutBtn" class="logout-btn">
    Logout
  </button>

   </form>
      
         
      <div class="table-wrapper">
    <h2>Windelgrössen</h2>

    <table>
      <thead>
        <tr>
          <th>Kilogramm</th>
          <th>Grösse</th>
        </tr>
      </thead>

      <tbody>
        <tr>
          <td>&lt;3</td>
          <td>1</td>
        </tr>

        <tr>
          <td>3-5</td>
          <td>2</td>
        </tr>

        <tr>
          <td>5-8</td>
          <td>3</td>
        </tr>

        <tr>
          <td>8-10</td>
          <td>4</td>
        </tr>

      </tbody>
    </table>
  </div>

   <nav class="bottom-nav">

        <a href="protected.html" class="nav-item">
          <div class="nav-icon">
            <img src="bilder/Icon1.png" alt="Home">
          </div>

          <span>Home</span>
        </a>


        <a href="bestellung.html" class="nav-item">
          <div class="nav-icon">
            <img src="bilder/Icon2.png" alt="Bestellung">
          </div>

          <span>Bestellung</span>
        </a>


        <a href="statistik.html" class="nav-item">
          <div class="nav-icon">
            <img src="bilder/Icon3.png" alt="Statistik">
          </div>

          <span>Statistik</span>
        </a>


        <a href="profil.html" class="nav-item active">
          <div class="nav-icon">
            <img src="bilder/Icon4.png" alt="Profil">
          </div>

          <span>Profil</span>
        </a>

      </nav>

  

    </main>

     <script src="js/auth.js"></script>
    <script src="js/profil.js" type="module"></script>
    <script src="js/logout.js"></script>
  </body>
</html>
