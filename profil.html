<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Profil</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/profil.css" />
  </head>
  <body>
    <h1>Profil</h1>

    <form id="profilForm">
      <div>
        <label>Vorname</label>
        <input type="text" id="vorname" required />
      </div>
      <div>
        <label>Nachname</label>
        <input type="text" id="nachname" required />
      </div>

      <div>
        <label>E-Mail</label>
        <input type="email" id="email" readonly />
      </div>
      

      <div>
        <label>Beigetreten am</label>
        <input type="text" id="beitrittsdatum" readonly />
      </div>

  <h2>Kinder</h2>

  <div id="kinderContainer"></div>

  <button type="button" id="addKindBtn">
    Kind hinzufügen
  </button>

  <br><br>

  <button type="submit">
    Speichern
  </button> 
      
         
      <div class="table-wrapper">
    <h2>Windelgrössen</h2>

    <table>
      <thead>
        <tr>
          <th>Kilogramm</th>
          <th>Grösse</th>
        </tr>
      </thead>

      <tbody>
        <tr>
          <td>&lt;3</td>
          <td>0</td>
        </tr>

        <tr>
          <td>3-5</td>
          <td>1</td>
        </tr>

        <tr>
          <td>5-8</td>
          <td>2</td>
        </tr>

        <tr>
          <td>8-10</td>
          <td>3</td>
        </tr>

        <tr>
          <td>10-13</td>
          <td>4</td>
        </tr>
      </tbody>
    </table>
  </div>

  
    </form>

     <script src="js/auth.js"></script>
    <script src="js/profil.js" type="module"></script>
  </body>
</html>
