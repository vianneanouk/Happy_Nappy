<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profil</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/profil.css" />
  </head>
  <body>

    <main class="profil-page">

      <section class="profil-header">
        <h1>Dein Profil</h1>
      </section>


    <form id="profilForm">
      <div>
        <label><h4>Vorname</h4></label>
        <input class="textfeld"type="text" id="vorname" required />
      </div>
      <div>
        <label><h4>Nachname</h4></label>
        <input class="textfeld" type="text" id="nachname" required />
      </div>

      <div>
        <label><h4>E-Mail</h4></label>
        <input class="textfeld" type="email" id="email" readonly />
      </div>
      

      <div>
        <label><h4>Beigetreten am</h4></label>
        <input class="textfeld" type="text" id="beitrittsdatum" readonly />
      </div>

          <div>
        <label><h4>Familie</h4></label>
        <input class="textfeld" type="text" id="familienname" readonly />
      </div>

      <div>
        <label><h4>Familien-ID</h4></label>
        <input class="textfeld" type="text" id="familien_id" readonly />
      </div>

      <div id="adminInviteSection">

      <div>
        <label><h4>Einladungslink</h4></label>
        <input class="textfeld" type="text" id="inviteLink" readonly />
      </div>

      </div>

  <h2>Kinder</h2>

  <div id="kinderContainer"></div>

  <button type="button" id="addKindBtn">
    Kind hinzufügen
  </button>

  <br><br>

  <button type="submit">
    Speichern
  </button> 
      
         
      <div class="table-wrapper">
    <h2>Windelgrössen</h2>

    <table>
      <thead>
        <tr>
          <th>Kilogramm</th>
          <th>Grösse</th>
        </tr>
      </thead>

      <tbody>
        <tr>
          <td>&lt;3</td>
          <td>1</td>
        </tr>

        <tr>
          <td>3-5</td>
          <td>2</td>
        </tr>

        <tr>
          <td>5-8</td>
          <td>3</td>
        </tr>

        <tr>
          <td>8-10</td>
          <td>4</td>
        </tr>

      </tbody>
    </table>
  </div>
