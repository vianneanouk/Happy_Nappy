<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Statistik</title>

    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/statistik.css" />
  </head>

  <body>
    <main class="dashboard-page">

      <section class="dashboard-header">
        <p class="welcome-text">
          Statistik für <span id="kind1Name">Kind</span>
        </p>

        <h1>Verbrauch</h1>
      </section>


      <section class="chart-switch">
        <button class="switch-btn active" data-child="lena" data-target="weeks">
          6 Wochen
        </button>

        <button class="switch-btn" data-child="lena" data-target="days">
          7 Tage
        </button>
      </section>


      <section class="chart-card lena-chart chart-weeks active-chart">
        <div class="chart-title">
          <img src="bilder/Paket.png" alt="Icon">
          <h2>Verbrauch letzte 6 Wochen</h2>
        </div>

        <div class="chart-container">
          <div class="chart-grid"></div>
          <div class="bars weekly-bars" id="kind1Weeks"></div>
        </div>
      </section>


      <section class="chart-card lena-chart chart-days">
        <div class="chart-title">
          <img src="bilder/Paket.png" alt="Icon">
          <h2>Verbrauch letzte 7 Tage</h2>
        </div>

        <div class="chart-container">
          <div class="chart-grid"></div>
          <div class="bars" id="kind1Days"></div>
        </div>
      </section>


      <section class="child-spacer"></section>


      <section class="dashboard-header second-child-header" id="kind2Header">
        <p class="welcome-text">
          Statistik für <span id="kind2Name">Kind</span>
        </p>

        <h1>Verbrauch</h1>
      </section>


      <section class="chart-switch" id="kind2Switch">
        <button class="switch-btn active" data-child="noah" data-target="weeks">
          6 Wochen
        </button>

        <button class="switch-btn" data-child="noah" data-target="days">
          7 Tage
        </button>
      </section>


      <section class="chart-card noah-chart chart-weeks active-chart">
        <div class="chart-title">
          <img src="bilder/Paket.png" alt="Icon">
          <h2>Verbrauch letzte 6 Wochen</h2>
        </div>

        <div class="chart-container">
          <div class="chart-grid"></div>
          <div class="bars weekly-bars" id="kind2Weeks"></div>
        </div>
      </section>


      <section class="chart-card noah-chart chart-days">
        <div class="chart-title">
          <img src="bilder/Paket.png" alt="Icon">
          <h2>Verbrauch letzte 7 Tage</h2>
        </div>

        <div class="chart-container">
          <div class="chart-grid"></div>
          <div class="bars" id="kind2Days"></div>
        </div>
      </section>

    </main>


    <nav class="bottom-nav">

      <a href="protected.html" class="nav-item">
        <div class="nav-icon">
          <img src="bilder/Icon1.png" alt="Home">
        </div>
        <span>Home</span>
      </a>

      <a href="bestellung.html" class="nav-item">
        <div class="nav-icon">
          <img src="bilder/Icon2.png" alt="Bestellung">
        </div>
        <span>Bestellung</span>
      </a>

      <a href="statistik.html" class="nav-item active">
        <div class="nav-icon">
          <img src="bilder/Icon3.png" alt="Statistik">
        </div>
        <span>Statistik</span>
      </a>

      <a href="profil.html" class="nav-item">
        <div class="nav-icon">
          <img src="bilder/Icon4.png" alt="Profil">
        </div>
        <span>Profil</span>
      </a>

    </nav>

    <script src="js/statistik.js"></script>
  </body>
</html>
