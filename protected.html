<!doctype html>
<html lang="de">
  <head>

      <!-- Das ist die Hauptseite der WebApp, die nach erfolgreichem Login angezeigt wird. Sie zeigt eine Übersicht über die eingetragenen Kinder sowie deren Windelbestand, Lieferungen und Verbrauch an.
       Wenn noch keine Kinder eingetragen sind, wird eine leere Ansicht mit einem Hinweis angezeigt. Die Navigation am unteren Bildschirmrand ermöglicht den Zugriff auf andere Bereiche der App wie Bestellung, Statistik und Profil.
       Die Navigation am unteren Bildschirmrand ermöglicht den Zugriff auf andere Bereiche der App wie Bestellung, Statistik und Profil. Das Layout und Design werden durch die CSS-Dateien style.css und protected.css gestaltet. Die JavaScript-Datei protected.js lädt die Benutzerdaten und aktualisiert die Anzeige entsprechend. -->

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard</title>

    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/protected.css" />
  </head>

  <body>
    <main class="dashboard-page">

      <section class="dashboard-header">
        <p class="welcome-text">Willkommen zurück</p>

        <h1>
          Hallo
          <span id="userVorname"></span>
        </h1>
      </section>

      <div id="childrenContainer"></div>

      <section class="info-card" id="emptyState" style="display: none;">
        <h2>Noch keine Kinder eingetragen</h2>
        <p>Füge in der Datenbank ein Kind hinzu, damit Bestand, Lieferung und Verbrauch angezeigt werden.</p>
      </section>

      <div id="protectedContent" style="display: none;">
        <span id="userId"></span>
      </div>

    </main>

    <nav class="bottom-nav">

      <a href="protected.html" class="nav-item active">
        <div class="nav-icon">
          <img src="bilder/Icon1.png" alt="Home">
        </div>
        <span>Home</span>
      </a>

      <a href="bestellung.html" class="nav-item">
        <div class="nav-icon">
          <img src="bilder/Icon2.png" alt="Bestellung">
        </div>
        <span>Bestellung</span>
      </a>

      <a href="statistik.html" class="nav-item">
        <div class="nav-icon">
          <img src="bilder/Icon3.png" alt="Statistik">
        </div>
        <span>Statistik</span>
      </a>

      <a href="profil.html" class="nav-item">
        <div class="nav-icon">
          <img src="bilder/Icon4.png" alt="Profil">
        </div>
        <span>Profil</span>
      </a>

    </nav>

    <script src="js/protected.js"></script>
    <script src="js/logout.js"></script>
  </body>
</html>
