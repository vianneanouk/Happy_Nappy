<!DOCTYPE html>
<html lang="en">
  <head>

    <!-- Hier können neue Nutzer:innen ein Konto erstellen, indem sie ihre E-Mail angeben und ein Passwort festlegen. Zusätzlich gibt es die Option, entweder eine neue Familie zu erstellen oder einer bestehenden Familie beizutreten, indem die familien_id eingegeben wird.
     Je nach Auswahl werden unterschiedliche Eingabefelder angezeigt. Die JavaScript-Datei register.js verarbeitet die Registrierung und kommuniziert mit dem Server, um das Konto zu erstellen. Bei Erfolg erfolgt eine Weiterleitung zum Login oder eine Fehlermeldung bei Problemen.
    -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Register</title>

    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/login.css" />
  </head>

  <body>

    <main class="login-page">

      <h1>Konto erstellen</h1>

      <p class="login-subtitle">
        Erstelle dein Konto, um loszulegen
      </p>

     <form id="registerForm">

  <div>
    <label>E-Mail</label>
    <input type="email" id="email" required />
  </div>

  <div>
    <label>Passwort</label>
    <input type="password" id="password" required />
  </div>

  <div>
    <label>Familie</label>

    <select name="mode" id="mode">
      <option value="new">Neue Familie erstellen</option>
      <option value="join">Bestehender Familie beitreten</option>
    </select>
  </div>

  <!-- Neue Familie -->
  <div id="familienname-container">
    <label>Familienname</label>

    <input
      type="text"
      id="familienname"
      name="familienname"
    >
  </div>

  <!-- Bestehende Familie -->
  <div id="familienid-container" style="display: none;">
    <label>Familien-ID</label>

    <input
      type="number"
      id="familien_id"
      name="familien_id"
      placeholder="Familien-ID"
    >
  </div>

  <p id="error-message" class="error-message"></p>

  <button class="register_button" type="submit">
    Registrieren
  </button>

</form>

      <p class="register-text">
        Hast du bereits ein Konto?
        <a href="login.html">Hier einloggen</a>.
      </p>

    </main>

    <script src="js/register.js"></script>

  </body>
</html>
