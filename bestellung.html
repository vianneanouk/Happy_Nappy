<!doctype html>
<html lang="de">
  <head>

    <!-- Hier werden die automatischen Bestellungen angezeigt, die auf den eingetragenen Kindern basieren. Wenn noch keine Kinder in der Datenbank vorhanden sind, wird eine leere Ansicht mit einem Hinweis angezeigt.
     Die Navigation am unteren Bildschirmrand ermöglicht den Zugriff auf andere Bereiche der App wie Home, Statistik und Profil. Das Layout und Design werden durch die CSS-Dateien style.css und bestellung.css gestaltet. Die JavaScript-Datei bestellung.js lädt die Bestelldaten und aktualisiert die Anzeige entsprechend.
    -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Bestellung</title>

    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/bestellung.css" />
  </head>

  <body>
    <main class="bestellung-page">

      <section class="bestellung-header">
        <h1>Deine Bestellung</h1>
      </section>

      <div id="ordersContainer"></div>

      <section class="empty-card" id="emptyState" style="display: none;">
        <h2>Noch keine Kinder eingetragen</h2>
        <p>Sobald Kinder in der Datenbank vorhanden sind, werden hier die automatischen Bestellungen angezeigt.</p>
      </section>

    </main>

    <nav class="bottom-nav">

      <a href="protected.html" class="nav-item">
        <div class="nav-icon">
          <img src="bilder/Icon1.png" alt="Home">
        </div>
        <span>Home</span>
      </a>

      <a href="bestellung.html" class="nav-item active">
        <div class="nav-icon">
          <img src="bilder/Icon2.png" alt="Bestellung">
        </div>
        <span>Bestellung</span>
      </a>

      <a href="statistik.html" class="nav-item">
        <div class="nav-icon">
          <img src="bilder/Icon3.png" alt="Statistik">
        </div>
        <span>Statistik</span>
      </a>

      <a href="profil.html" class="nav-item">
        <div class="nav-icon">
          <img src="bilder/Icon4.png" alt="Profil">
        </div>
        <span>Profil</span>
      </a>

    </nav>

    <script src="js/bestellung.js"></script>
  </body>
</html>
